<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Selector de Alimentos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f4f7f6;
            --text: #333;
            --card: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f4f7f6, #eaf2f8);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 900px;
        }

        h2 {
            margin: 0;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .mesa {
            margin-top: 10px;
            font-size: 16px;
            color: #666;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 900px;
        }

        .card-btn {
            background: var(--card);
            border: none;
            border-radius: 16px;
            padding: 20px 15px 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-btn img {
            width: 110px;
            height: auto;
            margin-bottom: 15px;
            transition: transform 0.25s ease;
        }

        .card-btn span {
            font-weight: bold;
            color: var(--primary);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 14px;
        }

        .card-btn:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 14px 30px rgba(0,0,0,0.15);
        }

        .card-btn:hover img {
            transform: scale(1.08);
        }

        .btn-back {
            margin-top: 40px;
            padding: 12px 25px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 6px 12px rgba(52, 152, 219, 0.25);
            transition: all 0.25s ease;
        }

        .btn-back:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 10px 18px rgba(52, 152, 219, 0.35);
        }

        .error {
            margin-top: 20px;
            color: #e74c3c;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            .card-btn img {
                width: 90px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>MESA {{ mesa }}</h2>
    </div>

    <div class="grid">

        <form method="POST">
            <input type="hidden" name="accion" value="ver_bebidas">
            <button type="submit" class="card-btn">
                <img src="{{ url_for('static', filename='img/bebida.png') }}" alt="Bebidas">
                <span>Bebidas</span>
            </button>
        </form>

        <form method="POST">
            <input type="hidden" name="accion" value="ver_comida">
            <button type="submit" class="card-btn">
                <img src="{{ url_for('static', filename='img/comida.png') }}" alt="Comidas">
                <span>Comidas</span>
            </button>
        </form>

        <form method="POST">
            <input type="hidden" name="accion" value="ver_extras">
            <button type="submit" class="card-btn">
                <img src="{{ url_for('static', filename='img/extra.png') }}" alt="Extras">
                <span>Extras</span>
            </button>
        </form>

        <form method="POST">
            <input type="hidden" name="accion" value="ver_cuenta">
            <button type="submit" class="card-btn">
                <img src="{{ url_for('static', filename='img/cuenta.png') }}" alt="Cuenta">
                <span>Cuenta</span>
            </button>
        </form>

    </div>

    <a href="{{ url_for('usuario_inicio') }}" class="btn-back">⬅ Volver</a>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

</body>
</html>
