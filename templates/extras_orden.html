<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - {{ tabla }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f4f7f6;
            --text: #333;
            --success: #27ae60;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            color: var(--text);
            padding: 40px 20px; 
            text-align: center; 
            margin: 0;
        }

        h2 { 
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--accent);
            display: inline-block;
            padding-bottom: 10px;
        }

        .table-container {
            width: 95%;
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            background: white;
        }

        th { 
            background: var(--primary); 
            color: white; 
            padding: 16px; 
            text-transform: uppercase; 
            font-size: 13px; 
            letter-spacing: 1px;
        }

        td { 
            padding: 14px; 
            border-bottom: 1px solid #eee;
            font-size: 16px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover { 
            background-color: #f9fbfd; 
            transition: 0.2s;
        }

        .btn-add {
            background: var(--success);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 3px 6px rgba(39, 174, 96, 0.3);
        }

        .btn-add:hover {
            background: #1e8449;
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(39, 174, 96, 0.4);
        }

        .btn-back { 
            display: inline-block; 
            margin-top: 30px; 
            padding: 12px 25px; 
            background: var(--accent); 
            color: white; 
            text-decoration: none; 
            border-radius: 10px; 
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.25);
        }

        .btn-back:hover { 
            background: #2980b9; 
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(52, 152, 219, 0.35);
        }

        .icon {
            margin-right: 8px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            th, td {
                font-size: 14px;
                padding: 10px;
            }

            .btn-add {
                padding: 6px 10px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <h2>{{ tabla }}</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    {% for col in columnas %}
                    <th>{{ col }}</th>
                    {% endfor %}
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for fila in datos %}
                <tr>
                    {% for valor in fila %}
                    <td>{{ valor }}</td>
                    {% endfor %}
                    <td>
                        <form method="POST" action="{{ url_for('agregar_orden') }}">
                            <input type="hidden" name="producto" value="{{ fila[0] }}">
                            <input type="hidden" name="precio" value="{{ fila[1] }}">
                            <input type="hidden" name="cantidad" value="1">
                            <input type="hidden" name="tipo" value="extras">
                            <button type="submit" class="btn-add">➕ Agregar</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <a href="{{ url_for('menu_mesa') }}" class="btn-back">
        <span class="icon">⬅</span> Volver al menú
    </a>

</body>
</html>
