<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - {{ tabla }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f4f7f6;
            --text: #333;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            color: var(--text);
            padding: 40px 20px; 
            text-align: center; 
            margin: 0;
        }

        h2 { 
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--accent);
            display: inline-block;
            padding-bottom: 10px;
        }

        .table-container {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            background: white;
        }

        th { 
            background: var(--primary); 
            color: white; 
            padding: 18px; 
            text-transform: uppercase; 
            font-size: 14px; 
            letter-spacing: 1px;
        }

        td { 
            padding: 15px; 
            border-bottom: 1px solid #eee;
            font-size: 16px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover { 
            background-color: #f9fbfd; 
            transition: 0.2s;
        }

        .btn-back { 
            display: inline-block; 
            margin-top: 30px; 
            padding: 12px 25px; 
            background: var(--accent); 
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.2);
        }

        .btn-back:hover { 
            background: #2980b9; 
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(52, 152, 219, 0.3);
        }

        .icon {
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <h2>EXTRAS{{ tabla }}</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    {% for col in columnas %}
                    <th>{{ col }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody>
                {% for fila in datos %}
                <tr>
                    {% for valor in fila %}
                    <td>{{ valor }}</td>
                    {% endfor %}
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <br>
    <a href="{{ url_for('administrador_inicio') }}" class="btn-back">
        <span class="icon">⬅</span> Volver al Panel de Control
    </a>

</body>
</html>
