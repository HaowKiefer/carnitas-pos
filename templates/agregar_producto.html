<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Producto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root { 
            --primary: #2c3e50; 
            --accent: #3498db; 
            --success: #27ae60;
            --bg: #f8f9fa; 
            --text: #333; 
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f4f7f6, #eaf2f8);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-container {
            background: white;
            padding: 35px 30px;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h2 {
            color: var(--primary);
            border-bottom: 3px solid var(--accent);
            display: inline-block;
            padding-bottom: 8px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 12px 12px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--success);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.25s ease;
            box-shadow: 0 6px 12px rgba(39, 174, 96, 0.25);
        }

        button:hover {
            background: #1e8449;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(39, 174, 96, 0.35);
        }

        .mensaje {
            margin-top: 15px;
            color: var(--success);
            font-weight: 600;
        }

        /* Botón de volver igual al de mesas */
        .btn-back {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 28px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 6px 12px rgba(52, 152, 219, 0.25);
            transition: all 0.25s ease;
        }

        .btn-back:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.35);
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Nuevo Producto</h2>

    <form method="POST">
        <label>Categoría</label>
        <select name="tipo" required>
            <option value="">Selecciona...</option>
            <option value="bebida">Bebida</option>
            <option value="comida">Comida</option>
            <option value="extra">Extra</option>
        </select>

        <label>Nombre del Producto</label>
        <input type="text" name="nombre" required>

        <label>Precio ($)</label>
        <input type="number" step="0.01" name="precio" placeholder="0.00" required>

        <button type="submit">Guardar Producto</button>
    </form>
    
    {% if mensaje %}
        <p class="mensaje">{{ mensaje }}</p>
    {% endif %}

    <a href="{{ url_for('administrador_inicio') }}" class="btn-back">⬅ Volver al Panel</a>
</div>

</body>
</html>
